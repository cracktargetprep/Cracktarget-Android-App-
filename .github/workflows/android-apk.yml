name: Build CrackTarget Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify WordPress bridge syntax
        run: |
          php -l wordpress/ct-app-login-bridge/ct-app-login-bridge.php
          python3 wordpress/tests/test_bridge.py
      - name: Build and lint Android
        run: gradle --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Verify APK identity and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.cracktarget.app'" apk-badging.txt
          grep -F "targetSdkVersion:'36'" apk-badging.txt
          grep -F 'application-icon-320:' apk-badging.txt
          unzip -Z1 "$APK" | grep -F 'ic_launcher'
      - uses: actions/upload-artifact@v4
        with:
          name: CrackTarget-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Install Android 16 emulator image
        run: sdkmanager 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64'
      - name: Enable emulator hardware acceleration
        run: sudo chmod 0666 /dev/kvm
      - name: Verify install, offline recovery and system navigation
        timeout-minutes: 8
        run: bash tools/android-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrackTarget-Android-Smoke-Test
          path: ${{ runner.temp }}/cracktarget-smoke/
          if-no-files-found: ignore
