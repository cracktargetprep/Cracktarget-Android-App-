
name: Build CrackTarget Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Prepare official CrackTarget launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          curl --fail --location --retry 3 --silent --show-error \
            "https://cracktarget.com/wp-content/uploads/2026/09/cropped-cracktarget.png" \
            -o app/src/main/res/drawable/cracktarget_launcher.png
          file app/src/main/res/drawable/cracktarget_launcher.png

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrackTarget-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
